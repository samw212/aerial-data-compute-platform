[project]
name = "groma-worker"
version = "0.1.0"
description = "arq background worker: ingest, reconstruct, tile, extract, coverage, optimise. Lands with M5."
requires-python = ">=3.12"
dependencies = [
    "groma-contracts",
    "groma-geo",
    "groma-coverage",
    "arq>=0.26",
    "redis>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["groma_worker"]
