[project]
name = "groma-worker"
version = "0.1.0"
description = "Background worker: coverage now; ingest, reconstruct, tile, extract, optimise as their milestones land."
requires-python = ">=3.12"
dependencies = [
    "groma-contracts",
    "groma-geo",
    "groma-coverage",
    "groma-api",
    "redis>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["groma_worker"]
