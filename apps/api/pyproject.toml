[project]
name = "groma-api"
version = "0.1.0"
description = "FastAPI application. Lands with M4."
requires-python = ">=3.12"
dependencies = [
    "groma-contracts",
    "groma-geo",
    "groma-coverage",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "geoalchemy2>=0.15",
    "pydantic-settings>=2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["groma_api"]
