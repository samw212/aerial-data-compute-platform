[project]
name = "groma-api"
version = "0.1.0"
description = "FastAPI service. Serves the M1 kernel now; the full API of build-spec 7 lands with M4."
requires-python = ">=3.12"
dependencies = [
    "groma-contracts",
    "groma-geo",
    "groma-coverage",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
# The database layer, build-spec 5. Held back until M4 so that the deployable
# service today has the same footprint as the kernel: no PostGIS, no Redis.
m4 = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "geoalchemy2>=0.15",
    "pydantic-settings>=2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["groma_api"]
