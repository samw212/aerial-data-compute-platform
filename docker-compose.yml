name: groma

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: groma
      POSTGRES_PASSWORD: groma-dev
      POSTGRES_DB: groma
    # Bound to localhost only: build-spec 19.5.
    ports:
      - "127.0.0.1:5433:5432"   # 5433 so a local Postgres on 5432 does not clash
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U groma -d groma"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Reconstruction backend. GROMA_NODEODM_URL empty => the ODM backend reports
  # available() = False and the fixture backend is used instead (build-spec 9.1).
  nodeodm:
    image: opendronemap/nodeodm:latest
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - nodeodm_data:/var/www/data
    profiles: ["recon"]

volumes:
  postgres_data:
  nodeodm_data:
