# Physical sensor dimensions, keyed by EXIF Make and Model. Build spec 8.2.
#
# EXIF gives focal length in millimetres and never gives sensor dimensions, but
# px/m depends on both. Every entry here is a published manufacturer figure; where
# a model is absent the ingest falls back to sensor_w_mm = 36 * focal / focal35
# and records `sensor_estimated` in capture_qa.warnings, because an estimated
# sensor size propagates straight into GSD and into every px/m in the report.
#
# `model` is matched case-insensitively after stripping whitespace. Several DJI
# aircraft report only the camera board name (FC6310, L1D-20c), which is why the
# board names appear as their own entries rather than as aliases of the aircraft.

sensors:
  # --- 1-inch class ------------------------------------------------------------
  - make: DJI
    model: FC6310            # Phantom 4 Pro / Pro V2.0
    sensor_w_mm: 13.2
    sensor_h_mm: 8.8
    res_x: 5472
    res_y: 3648
  - make: DJI
    model: FC6310R           # Phantom 4 RTK
    sensor_w_mm: 13.2
    sensor_h_mm: 8.8
    res_x: 5472
    res_y: 3648
