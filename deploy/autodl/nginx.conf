# ADCP single-port ingress. Build spec 19.1. Rendered by bootstrap.sh.
#
#   :6006  /          the built SPA (apps/web/dist)
#          /api       uvicorn :8000
#          /ws        uvicorn :8000 (WebSocket upgrade)
#          /tiles     static artefacts (3D Tiles, XYZ tiles, glTF)

worker_processes 2;
pid __GROMA_HOME__/run/nginx.pid;
error_log __GROMA_HOME__/logs/nginx-error.log warn;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log __GROMA_HOME__/logs/nginx-access.log;
  sendfile on;
  client_max_body_size 4g;          # image uploads; the API enforces GROMA_MAX_UPLOAD_GB
  client_body_temp_path __GROMA_HOME__/run/nginx-body;
  proxy_temp_path __GROMA_HOME__/run/nginx-proxy;
  fastcgi_temp_path __GROMA_HOME__/run/nginx-fcgi;
  uwsgi_temp_path __GROMA_HOME__/run/nginx-uwsgi;
  scgi_temp_path __GROMA_HOME__/run/nginx-scgi;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;
  gzip_min_length 1024;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  server {
    listen __GROMA_PORT__;
    server_name _;
    root __GROMA_HOME__/app/apps/web/dist;

    location /api/ {
      proxy_pass http://127.0.0.1:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 600s;
    }
    location /ws/ {
      proxy_pass http://127.0.0.1:8000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_read_timeout 3600s;
    }
    location /tiles/ {
      alias __GROMA_HOME__/artefacts/tiles/;
      add_header Cache-Control "public, max-age=3600";
      try_files $uri =404;
    }
    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }
    location / {
      try_files $uri /index.html;
      add_header Cache-Control "no-cache";
    }
  }
}
