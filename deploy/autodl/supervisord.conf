; Groma under supervisord on an AutoDL instance. Build-spec 19.1.
;
; AutoDL containers have no systemd, so supervisord is what keeps the service
; running and restarts it if it dies. Everything lives under GROMA_HOME on the
; data disk (/root/autodl-tmp), which survives an instance shutdown; the system
; disk is small and is where AutoDL keeps its own image.
;
; The service binds port 6006 directly. That is the one port AutoDL exposes to
; the outside through its "custom service" link, and until the M3 frontend
; exists there is nothing for nginx to serve in front of it.
;
; Paths are filled in by bootstrap.sh from this template; do not hand-edit the
; generated copy at $GROMA_HOME/run/supervisord.conf — edit this file and run
; `groma-ctl update` instead.
;
; The control socket lives in /tmp rather than under GROMA_HOME because Unix
; socket paths are limited to about 108 characters, and an install in a deep
; directory would otherwise fail to start with "AF_UNIX path too long".

[unix_http_server]
file=/tmp/groma-supervisor.sock

[supervisord]
logfile=__GROMA_HOME__/logs/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
pidfile=__GROMA_HOME__/run/supervisord.pid
childlogdir=__GROMA_HOME__/logs
nodaemon=false

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/groma-supervisor.sock

[program:groma-api]
command=__GROMA_HOME__/app/.venv/bin/uvicorn groma_api.main:app --host 0.0.0.0 --port 6006 --workers 1 --log-level info
directory=__GROMA_HOME__/app
environment=GROMA_SITE_FIXTURE="__GROMA_HOME__/app/fixtures/sites/site_alpha.json",GROMA_KERNEL_MAX_CELLS="2000000",PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
startsecs=3
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=__GROMA_HOME__/logs/groma-api.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
redirect_stderr=true
