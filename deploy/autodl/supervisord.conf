; ADCP under supervisord on an AutoDL instance. Build spec 19.1.
;
; AutoDL containers have no systemd, so supervisord keeps every program running
; and restarts it if it dies. Everything lives under GROMA_HOME on the data disk
; (/root/autodl-tmp), which survives an instance shutdown; the system disk is
; small and is where AutoDL keeps its own image.
;
; nginx :6006 is the one port AutoDL exposes. It serves the built SPA and proxies
; /api and /ws to uvicorn :8000. Postgres and Redis bind to localhost only.
;
; Paths are filled in by bootstrap.sh from this template; do not hand-edit the
; generated copy at $GROMA_HOME/run/supervisord.conf.

[unix_http_server]
file=/tmp/groma-supervisor.sock

[supervisord]
logfile=__GROMA_HOME__/logs/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
pidfile=__GROMA_HOME__/run/supervisord.pid
childlogdir=__GROMA_HOME__/logs
nodaemon=false

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/groma-supervisor.sock

[program:postgres]
command=/usr/lib/postgresql/14/bin/postgres -D __GROMA_HOME__/data/pg
user=postgres
priority=10
autostart=true
autorestart=true
startsecs=3
stopsignal=INT
stopwaitsecs=30
stdout_logfile=__GROMA_HOME__/logs/postgres.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
redirect_stderr=true

[program:redis]
command=/usr/bin/redis-server --bind 127.0.0.1 --port 6379 --dir __GROMA_HOME__/data --save 300 10 --appendonly no
priority=10
autostart=true
autorestart=true
startsecs=2
stdout_logfile=__GROMA_HOME__/logs/redis.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true

[program:api]
command=__GROMA_HOME__/app/.venv/bin/uvicorn groma_api.main:app --host 127.0.0.1 --port 8000 --workers 2 --log-level info --proxy-headers
directory=__GROMA_HOME__/app
environment=GROMA_ENV_FILE="/etc/groma.env",PYTHONUNBUFFERED="1",GROMA_WEB_DIST="__GROMA_HOME__/app/apps/web/dist"
priority=20
autostart=true
autorestart=true
startsecs=3
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=__GROMA_HOME__/logs/api.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
redirect_stderr=true

[program:worker]
command=__GROMA_HOME__/app/.venv/bin/python -m groma_worker
directory=__GROMA_HOME__/app
environment=GROMA_ENV_FILE="/etc/groma.env",PYTHONUNBUFFERED="1"
priority=25
autostart=true
autorestart=true
startsecs=3
startretries=5
stopasgroup=true
killasgroup=true
stopwaitsecs=60
stdout_logfile=__GROMA_HOME__/logs/worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
redirect_stderr=true

[program:nginx]
command=/usr/sbin/nginx -c __GROMA_HOME__/run/nginx.conf -g "daemon off;"
priority=30
autostart=true
autorestart=true
startsecs=2
stdout_logfile=__GROMA_HOME__/logs/nginx.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true

[group:groma]
programs=postgres,redis,api,worker,nginx
