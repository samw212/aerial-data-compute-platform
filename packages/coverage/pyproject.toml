[project]
name = "groma-coverage"
version = "0.1.0"
description = """Pure coverage kernel. NumPy in, NumPy out. No I/O, no database, \
no framework, no logging of user data. Compiles to WASM."""
requires-python = ">=3.12"
dependencies = ["groma-contracts", "groma-geo", "numpy>=1.26"]

[project.optional-dependencies]
# blind_polygons() falls back to a bundled marching-squares tracer when these
# are absent, so the kernel stays installable anywhere.
polygons = ["shapely>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["groma_coverage"]
