[project]
name = "groma-geo"
version = "0.1.0"
description = "Coordinate frames, height datums, optics, raster helpers."
requires-python = ">=3.12"
dependencies = ["groma-contracts", "numpy>=1.26"]

[project.optional-dependencies]
# CRS transforms and raster IO land with M8/M9. optics.py and origin.py need
# neither, and the kernel suite must install without GDAL present.
crs = ["pyproj>=3.6", "shapely>=2.0", "rasterio>=1.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["groma_geo"]
