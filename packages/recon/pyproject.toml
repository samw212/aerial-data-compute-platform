[project]
name = "groma-recon"
version = "0.1.0"
description = "Reconstruction backends (fixture, NodeODM, COLMAP) and artefact validation."
requires-python = ">=3.12"
# Skeleton only: this package lands with M7. Its heavy dependencies are held in
# the extra below so that the workspace — and the M1 kernel test suite — installs
# on a machine with no GDAL, no PDAL and no CUDA.
dependencies = ["groma-contracts", "groma-geo", "numpy>=1.26"]

[project.optional-dependencies]
m7 = ["httpx>=0.27", "laspy>=2.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["groma_recon"]
