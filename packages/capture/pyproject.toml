[project]
name = "groma-capture"
version = "0.1.0"
description = "Capture ingest, EXIF/XMP, quality gating, overlap estimation, video keyframes."
requires-python = ">=3.12"
# Skeleton only: this package lands with M6. Its heavy dependencies are held in
# the extra below so that the workspace — and the M1 kernel test suite — installs
# on a machine with no GDAL, no PDAL and no CUDA.
dependencies = ["groma-contracts", "groma-geo", "numpy>=1.26"]

[project.optional-dependencies]
# Pillow decodes frames and pyyaml reads the sensor table. The Laplacian is
# implemented in NumPy rather than pulled from OpenCV, so that the same numbers
# come out in the worker, the CLI and CI without a 60 MB wheel.
m6 = ["pillow>=10.0", "pyyaml>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["groma_capture"]
